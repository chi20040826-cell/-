name: PomoLoop
options:
  bundleIdPrefix: com.pomoloop.private
targets:
  PomoLoop:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PomoLoop
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomoloop.private
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PomoLoop/Info.plist
    dependencies:
      - target: PomoLoopLiveActivity
  PomoLoopLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PomoLoopLiveActivity
        excludes:
          - PomoLoopLiveActivityBundle.swift
          - PomoLoopLiveActivityAttributes.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomoloop.private.liveactivity
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PomoLoopLiveActivity/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
